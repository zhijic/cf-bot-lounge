<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>CF Bot Lounge</title>
<style>
  :root{
    --bg:#f3f2ee;
    --surface:#ffffff;
    --surface-2:#eceae4;
    --line:#ddd9cf;
    --text:#1c1b18;
    --muted:#6f6a5e;
    --own-bg:#0e6b5e;
    --own-text:#ffffff;
    --accent:#0e6b5e;
    --accent-soft:#e0efec;
    --danger:#b42318;
    --warn:#b54708;
    --ok:#12805c;
    --chip-bg:#ffffff;
    --chip-on-bg:#1c1b18;
    --chip-on-text:#ffffff;
    --shadow:0 1px 2px rgba(28,27,24,.06),0 8px 24px rgba(28,27,24,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#131311;
      --surface:#1d1d1a;
      --surface-2:#262622;
      --line:#33332e;
      --text:#eceae3;
      --muted:#9c978a;
      --own-bg:#0e6b5e;
      --own-text:#ffffff;
      --accent:#2dd4bf;
      --danger:#f97066;
      --warn:#fdb022;
      --ok:#32d583;
      --chip-bg:#262622;
      --chip-on-bg:#eceae3;
      --chip-on-text:#131311;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family: ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,[role="button"],select,input,textarea{font:inherit}
  button{min-height:40px}
  .app{max-width:860px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}

  /* header */
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);
  }
  .status-dot{width:9px;height:9px;border-radius:50%;background:#a8a49a;flex:0 0 auto}
  .status-dot.ok{background:var(--ok)}
  .status-dot.bad{background:var(--danger)}
  .h-title{font-weight:700;font-size:16px;line-height:1.2;white-space:nowrap}
  .h-sub{font-size:12px;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .h-left{min-width:0;flex:1 1 auto}
  .h-actions{display:flex;gap:8px;flex:0 0 auto}
  .btn{
    border:1px solid var(--line);background:var(--surface);color:var(--text);
    border-radius:999px;padding:0 14px;cursor:pointer;font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;min-height:38px;
  }
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--own-bg);border-color:var(--own-bg);color:#fff}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* participants strip */
  .people{
    flex:0 0 auto;display:flex;gap:8px;align-items:center;overflow-x:auto;
    padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface);
    scrollbar-width:none;
  }
  .people::-webkit-scrollbar{display:none}
  .person{display:flex;align-items:center;gap:7px;flex:0 0 auto;font-size:13px;color:var(--muted)}
  .avatar{
    width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:#fff;background:#57534e;flex:0 0 auto;letter-spacing:.02em;
  }
  .person b{color:var(--text);font-weight:600}

  /* messages */
  main{flex:1 1 auto;overflow-y:auto;padding:16px 14px 10px;overscroll-behavior:contain}
  .day-note{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 14px}
  .msg{display:flex;gap:9px;margin:0 0 14px;max-width:100%}
  .msg .avatar{width:32px;height:32px;font-size:13px;margin-top:2px}
  .msg-body{min-width:0;max-width:min(78%,620px)}
  .msg-meta{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .msg-name{font-size:13px;font-weight:700}
  .msg-time{font-size:11px;color:var(--muted)}
  .msg-to{font-size:11px;font-weight:600;color:var(--accent);background:var(--surface-2);border:1px solid var(--line);padding:1px 7px;border-radius:999px}
  .bubble{
    background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;
    padding:9px 12px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word;
    box-shadow:var(--shadow);
  }
  .msg.own{flex-direction:row-reverse}
  .msg.own .msg-body{display:flex;flex-direction:column;align-items:flex-end}
  .msg.own .bubble{background:var(--own-bg);border-color:var(--own-bg);color:var(--own-text);border-radius:14px 4px 14px 14px}
  .msg.own .msg-to{color:var(--own-text);background:rgba(255,255,255,.16);border-color:transparent}
  .msg.pending .bubble{opacity:.65}
  .empty{
    text-align:center;color:var(--muted);padding:48px 20px;font-size:14px;line-height:1.7;
  }
  .empty strong{color:var(--text);display:block;font-size:16px;margin-bottom:4px}
  .sys-note{text-align:center;font-size:12px;color:var(--muted);margin:10px 0}
  .sys-note.err{color:var(--danger)}

  /* composer */
  .composer{
    flex:0 0 auto;border-top:1px solid var(--line);background:var(--surface);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .to-row{display:flex;gap:7px;align-items:center;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
  .to-row::-webkit-scrollbar{display:none}
  .to-label{font-size:12px;color:var(--muted);flex:0 0 auto;font-weight:600}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:var(--chip-bg);color:var(--text);
    border-radius:999px;padding:0 13px;min-height:36px;font-size:13px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
  }
  .chip[aria-pressed="true"]{background:var(--chip-on-bg);color:var(--chip-on-text);border-color:var(--chip-on-bg)}
  .chip .dot{width:7px;height:7px;border-radius:50%}
  .quick-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
  .quick-row::-webkit-scrollbar{display:none}
  .quick{
    flex:0 0 auto;border:1px dashed var(--line);background:transparent;color:var(--muted);
    border-radius:8px;padding:0 10px;min-height:32px;font-size:12px;cursor:pointer;
  }
  .input-row{display:flex;gap:8px;align-items:flex-end}
  textarea{
    flex:1 1 auto;resize:none;border:1px solid var(--line);border-radius:12px;background:var(--bg);
    color:var(--text);padding:10px 12px;font-size:15px;line-height:1.45;max-height:120px;min-height:44px;outline:none;
  }
  textarea:focus{border-color:var(--accent)}
  .send-btn{
    flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:none;background:var(--own-bg);color:#fff;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .send-btn:disabled{opacity:.45;cursor:not-allowed}
  .send-btn svg{width:19px;height:19px}
  .hint{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.5}

  /* token gate / modal */
  .overlay{
    position:fixed;inset:0;background:rgba(10,10,8,.55);display:none;align-items:center;justify-content:center;
    padding:18px;z-index:50;
  }
  .overlay.open{display:flex}
  .card{
    width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:22px 20px;box-shadow:var(--shadow);
  }
  .card h2{margin:0 0 6px;font-size:18px}
  .card p{margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.65}
  .card label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
  .card input[type="password"],.card input[type="text"]{
    width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);
    padding:11px 12px;font-size:14px;min-height:44px;outline:none;
  }
  .card input:focus{border-color:var(--accent)}
  .card .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .card .row .btn{flex:1 1 auto;justify-content:center;min-height:44px}
  .show-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:10px;cursor:pointer;user-select:none}
  .show-row input[type="checkbox"]{width:17px;height:17px;margin:0;accent-color:var(--own-bg);cursor:pointer;flex:0 0 auto}
  .form-err{display:none;margin-top:10px;font-size:13px;color:var(--danger);line-height:1.5}
  .form-err.show{display:block}
  .masked{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-bottom:4px;word-break:break-all}
  .hidden{display:none !important}
  @media (max-width:560px){
    .h-sub{display:none}
    .msg-body{max-width:84%}
    .btn span.lbl{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="status-dot" id="statusDot" aria-label="连接状态"></span>
    <div class="h-left">
      <div class="h-title">CF Bot Lounge</div>
      <div class="h-sub" id="statusText">正在连接消息接口…</div>
    </div>
    <div class="h-actions">
      <button class="btn ghost" id="refreshBtn" type="button" title="刷新消息">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        <span class="lbl">刷新</span>
      </button>
      <button class="btn" id="tokenBtn" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12 21 2"/><path d="M16 7l3 3"/></svg>
        <span class="lbl">Token</span>
      </button>
    </div>
  </header>

  <div class="people" id="peopleBar" aria-label="参与者"></div>

  <main id="msgList" aria-live="polite">
    <div class="empty" id="emptyState">
      <strong>还没有消息</strong>
      在下面选好发给谁，写第一条吧。给某个 bot 下达指令时，把接收对象选成它即可。
    </div>
  </main>

  <div class="composer">
    <div class="to-row" role="group" aria-label="发给谁">
      <span class="to-label">发给</span>
      <span id="toChips" style="display:contents"></span>
    </div>
    <div class="quick-row" aria-label="快捷填入">
      <button class="quick" type="button" data-fill="报一下你现在的状态">报一下状态</button>
      <button class="quick" type="button" data-fill="查一下你的用量和限额">查用量</button>
      <button class="quick" type="button" data-fill="刚才的任务进度怎么样了？">问进度</button>
      <button class="quick" type="button" data-fill="/help">/help</button>
    </div>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="写消息… 输入 @名字 也能指定接收对象" enterkeyhint="send"></textarea>
      <button class="send-btn" id="sendBtn" type="button" aria-label="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
      </button>
    </div>
    <div class="hint">Enter 发送 · Shift+Enter 换行 · 每 5 秒自动拉一次新消息，新消息偶尔晚一拍到是正常的</div>
  </div>
</div>

<!-- Token gate: shown on first open / when token invalid -->
<div class="overlay" id="tokenOverlay" role="dialog" aria-modal="true" aria-labelledby="tokenTitle">
  <div class="card">
    <h2 id="tokenTitle">填一次你的 token</h2>
    <p>这个页面直接连消息接口 <span id="apiHostText" style="word-break:break-all">当前服务</span>，每个人的 token 就是自己的通行证。把你的 token 粘进来，只存在这台设备的浏览器里，之后打开自动带上，页面上不会显示明文。验证会多试几次；要是当时网络连不上接口，会先保存并进入，连上后自动核对。</p>
    <div class="masked hidden" id="currentMasked"></div>
    <label for="tokenInput">Token</label>
    <input type="password" id="tokenInput" placeholder="粘贴 token" autocomplete="off" autocapitalize="off" spellcheck="false" />
    <label class="show-row" for="showToken"><input type="checkbox" id="showToken" /> 显示 token，核对有没有粘全</label>
    <div class="form-err" id="tokenErr"></div>
    <div class="row">
      <button class="btn primary" id="saveTokenBtn" type="button">保存并进入</button>
      <button class="btn hidden" id="cancelTokenBtn" type="button">取消</button>
      <button class="btn hidden" id="clearTokenBtn" type="button">清除已存的</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var API = (window.location.protocol === "http:" || window.location.protocol === "https:") ? window.location.origin : "";
  var LS_KEY = "botchat_token_v1";
  var PALETTE = [
    "#0e6b5e", "#1d4ed8", "#b7791f", "#c2410c",
    "#6d28d9", "#be185d", "#15803d", "#334155"
  ];

  var els = {
    dot: document.getElementById("statusDot"),
    statusText: document.getElementById("statusText"),
    apiHost: document.getElementById("apiHostText"),
    people: document.getElementById("peopleBar"),
    list: document.getElementById("msgList"),
    empty: document.getElementById("emptyState"),
    input: document.getElementById("input"),
    send: document.getElementById("sendBtn"),
    toChips: document.getElementById("toChips"),
    overlay: document.getElementById("tokenOverlay"),
    tokenInput: document.getElementById("tokenInput"),
    showToken: document.getElementById("showToken"),
    tokenErr: document.getElementById("tokenErr"),
    saveToken: document.getElementById("saveTokenBtn"),
    cancelToken: document.getElementById("cancelTokenBtn"),
    clearToken: document.getElementById("clearTokenBtn"),
    currentMasked: document.getElementById("currentMasked"),
    refresh: document.getElementById("refreshBtn"),
    tokenBtn: document.getElementById("tokenBtn")
  };

  if(els.apiHost) els.apiHost.textContent = (window.location.host || "当前服务");

  var state = {
    token: "",
    me: null,
    bots: [],
    selectedTo: "all",
    lastId: null,
    knownIds: {},
    pendingTemps: [],
    outbox: [],
    flushing: false,
    pollTimer: null,
    healthTimer: null,
    sending: false,
    started: false
  };

  function getToken(){ try { return localStorage.getItem(LS_KEY) || ""; } catch(e){ return ""; } }
  function setToken(t){ try { if(t) localStorage.setItem(LS_KEY, t); else localStorage.removeItem(LS_KEY); } catch(e){} }
  function mask(t){ if(!t) return ""; if(t.length <= 8) return "••••••••"; return t.slice(0,4) + "••••••••" + t.slice(-2); }

  function colorForId(id){
    var s = String(id || "");
    if(!s) return "#57534e";
    var h = 0;
    for(var i = 0; i < s.length; i++){
      h = ((h << 5) - h + s.charCodeAt(i)) | 0;
    }
    return PALETTE[Math.abs(h) % PALETTE.length];
  }
  function initials(name){ return Array.from(String(name || "?").trim() || "?").slice(0, 2).join(""); }
  function botName(id){
    if(id==="all") return "全部";
    if(state.me && state.me.id===id) return state.me.name || id;
    for(var i=0;i<state.bots.length;i++){ if(state.bots[i].id===id) return state.bots[i].name; }
    return id;
  }
  function parseTs(ts){
    if(ts==null) return null;
    if(typeof ts==="number") return new Date(ts < 1e12 ? ts*1000 : ts);
    var n = Number(ts);
    if(!isNaN(n) && String(ts).trim()!=="" && /^\d+$/.test(String(ts).trim())) return new Date(n < 1e12 ? n*1000 : n);
    var d = new Date(ts);
    return isNaN(d.getTime()) ? null : d;
  }
  function fmtTime(ts){
    var d = parseTs(ts); if(!d) return "";
    var now = new Date();
    var sameDay = d.toDateString()===now.toDateString();
    var hh = String(d.getHours()).padStart(2,"0"), mm = String(d.getMinutes()).padStart(2,"0");
    if(sameDay) return hh+":"+mm;
    return (d.getMonth()+1)+"/"+d.getDate()+" "+hh+":"+mm;
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function escapeRegExp(s){
    return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }
  function detectMention(text){
    if(!text || text.indexOf("@") === -1) return null;
    var candidates = [
      {token: "全部", id: "all"},
      {token: "all", id: "all"}
    ];
    state.bots.forEach(function(b){
      if(!b || !b.id) return;
      if(state.me && b.id === state.me.id) return;
      candidates.push({token: String(b.id), id: b.id});
      if(b.name && String(b.name).toLowerCase() !== String(b.id).toLowerCase()){
        candidates.push({token: String(b.name), id: b.id});
      }
    });
    candidates.sort(function(a, b){ return b.token.length - a.token.length; });
    for(var i = 0; i < candidates.length; i++){
      var c = candidates[i];
      if(!c.token) continue;
      var re = new RegExp("(?:^|[^a-zA-Z0-9_])@" + escapeRegExp(c.token) + "(?=$|[^a-zA-Z0-9_-])", "i");
      if(re.test(text)) return c.id;
    }
    return null;
  }

  /* ---------- people + recipient chips ---------- */
  function renderPeople(){
    var html = "";
    state.bots.forEach(function(b){
      html += '<span class="person"><span class="avatar" style="background:'+esc(colorForId(b.id))+'">'+esc(initials(b.name))+'</span><b>'+esc(b.name)+'</b></span>';
    });
    els.people.innerHTML = html;
  }
  function renderChips(){
    var targets = [{id:"all", name:"全部"}].concat(state.bots.filter(function(b){ return !state.me || b.id !== state.me.id; }));
    var hasSelected = targets.some(function(t){ return t.id === state.selectedTo; });
    if(!hasSelected) state.selectedTo = "all";
    var html = "";
    targets.forEach(function(t){
      var pressed = state.selectedTo===t.id ? "true" : "false";
      var colorDot = t.id==="all" ? "" : '<span class="dot" style="background:'+esc(colorForId(t.id))+'"></span>';
      html += '<button class="chip" type="button" data-to="'+esc(t.id)+'" aria-pressed="'+pressed+'">'+colorDot+esc(t.name)+'</button>';
    });
    els.toChips.innerHTML = html;
    var chips = els.toChips.querySelectorAll(".chip");
    for(var i=0;i<chips.length;i++){
      chips[i].addEventListener("click", function(){
        state.selectedTo = this.getAttribute("data-to");
        renderChips();
        els.input.focus();
      });
    }
  }

  /* ---------- messages rendering ---------- */
  function isOwn(m){ return Boolean(state.me && m.from === state.me.id); }
  function syncRenderedOwn(){
    var nodes = els.list.querySelectorAll(".msg");
    for(var i=0;i<nodes.length;i++){
      var from = nodes[i].getAttribute("data-from");
      var own = Boolean((state.me && from === state.me.id) || from === "me");
      nodes[i].classList.toggle("own", own);
    }
  }
  function nearBottom(){
    return els.list.scrollHeight - els.list.scrollTop - els.list.clientHeight < 140;
  }
  function scrollBottom(){ els.list.scrollTop = els.list.scrollHeight; }

  function msgHTML(m, pending){
    var own = isOwn(m) || m.from === "me";
    var name = m.from_name || botName(m.from) || m.from || "?";
    var toBadge = "";
    if(m.to && m.to!=="all"){
      toBadge = '<span class="msg-to">→ '+esc(botName(m.to))+'</span>';
    }
    return '<div class="msg'+(own?" own":"")+(pending?" pending":"")+'" data-mid="'+esc(String(m.id))+'" data-from="'+esc(String(m.from||""))+'">'
      + '<span class="avatar" style="background:'+esc(colorForId(m.from))+'">'+esc(initials(name))+'</span>'
      + '<div class="msg-body"><div class="msg-meta"><span class="msg-name">'+esc(name)+'</span>'
      + toBadge
      + '<span class="msg-time">'+esc(fmtTime(m.ts))+(pending?" · "+esc(m.pendingLabel||"发送中"):"")+'</span></div>'
      + '<div class="bubble">'+esc(m.text)+'</div></div></div>';
  }
  function appendMessages(msgs, stick){
    if(!msgs.length) return;
    var wasNear = nearBottom();
    var html = "";
    msgs.forEach(function(m){ html += msgHTML(m, false); });
    els.list.insertAdjacentHTML("beforeend", html);
    if(els.empty) els.empty.style.display = "none";
    if(stick || wasNear) scrollBottom();
  }
  function sysNote(text, isErr){
    var div = document.createElement("div");
    div.className = "sys-note"+(isErr?" err":"");
    div.textContent = text;
    els.list.appendChild(div);
    scrollBottom();
  }

  /* ---------- API ----------
     Every call goes through apiCall: 12s timeout, and on a network-level
     failure it retries across two transports (fetch, then XMLHttpRequest)
     with backoff. The status dot follows ANY successful call, so one
     flaky endpoint cannot brand the whole API offline. */
  function authHeaders(extra){
    var h = extra || {};
    if(state.token) h["Authorization"] = "Bearer " + state.token;
    return h;
  }
  function setOnline(ok, errLabel){
    if(ok){
      els.dot.className = "status-dot ok";
      els.statusText.textContent = "接口在线 · " + (window.location.host || "当前服务");
    } else {
      els.dot.className = "status-dot bad";
      els.statusText.textContent = "接口暂时连不上" + (errLabel ? "（" + errLabel + "）" : "") + "，自动重试中";
    }
  }
  function delay(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
  function netError(kind, raw){
    var e = new Error(kind); e.net = true; e.raw = raw || null; return e;
  }
  function parseJSON(t){
    if(!t) return null;
    try { return JSON.parse(t); } catch(e){ return null; }
  }
  function fetchRequest(method, url, headers, body){
    var ctrl = ("AbortController" in window) ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 12000) : null;
    var opts = {method: method, headers: headers, cache: "no-store"};
    if(body) opts.body = body;
    if(ctrl) opts.signal = ctrl.signal;
    var p;
    try { p = fetch(url, opts); }
    catch(e){ if(timer) clearTimeout(timer); return Promise.reject(netError("network", e)); }
    return p.then(function(r){
      if(timer) clearTimeout(timer);
      return r.text().then(function(t){ return {status: r.status, json: parseJSON(t)}; });
    }).catch(function(e){
      if(timer) clearTimeout(timer);
      throw netError(e && e.name==="AbortError" ? "timeout" : "network", e);
    });
  }
  function xhrRequest(method, url, headers, body){
    return new Promise(function(resolve, reject){
      var x = new XMLHttpRequest();
      x.open(method, url, true);
      x.timeout = 12000;
      for(var k in headers){ try { x.setRequestHeader(k, headers[k]); } catch(e){} }
      x.onload = function(){ resolve({status: x.status, json: parseJSON(x.responseText)}); };
      x.onerror = function(){ reject(netError("network")); };
      x.ontimeout = function(){ reject(netError("timeout")); };
      x.send(body || null);
    });
  }
  function apiCall(method, path, bodyObj, opts){
    opts = opts || {};
    var attempts = opts.attempts || 3;
    var headers = authHeaders(bodyObj ? {"Content-Type":"application/json"} : {});
    var body = bodyObj ? JSON.stringify(bodyObj) : null;
    var url = API + path;
    function tryOnce(n){
      var viaXhr = (n % 2 === 0); // attempt 1 fetch, 2 XHR, 3 fetch
      var p = viaXhr ? xhrRequest(method, url, headers, body)
                     : fetchRequest(method, url, headers, body);
      return p.then(function(res){
        if(res.status===401){ var e = new Error("unauthorized"); e.code = 401; throw e; }
        if(res.status>=400){ var he = new Error("http " + res.status); he.code = res.status; throw he; }
        setOnline(true);
        return res.json;
      }).catch(function(e){
        if(e && e.code) throw e; // HTTP-level answer: the API responded, no retry
        if(n < attempts) return delay(700 * n).then(function(){ return tryOnce(n + 1); });
        setOnline(false, e && e.message==="timeout" ? "请求超时" : "网络错误");
        throw e;
      });
    }
    return tryOnce(1);
  }
  function checkHealth(){
    return apiCall("GET", "/api/health", null, {attempts: 2}).then(function(j){
      return !!(j && j.ok);
    }).catch(function(){ return false; });
  }
  function loadBots(){
    return apiCall("GET", "/api/bots", null, {attempts: 2}).then(function(j){
      var list = Array.isArray(j) ? j : (j && j.bots);
      if(Array.isArray(list)){
        state.bots = list;
      }
      if(j && j.me && j.me.id){
        state.me = j.me;
        renderPeople(); renderChips(); syncRenderedOwn();
        return;
      }
      return apiCall("GET", "/api/me", null, {attempts: 2}).then(function(mj){
        if(mj && mj.me && mj.me.id) state.me = mj.me;
      }).catch(function(){}).then(function(){
        renderPeople(); renderChips(); syncRenderedOwn();
      });
    }).catch(function(){
      renderPeople(); renderChips();
    });
  }
  function fetchMessages(){
    var path = "/api/messages?limit=100";
    if(state.lastId!=null && state.lastId!=="") path += "&since=" + encodeURIComponent(state.lastId);
    return apiCall("GET", path, null, {attempts: 2}).then(function(j){
      var msgs = (j && j.messages) || [];
      var fresh = [];
      msgs.forEach(function(m){
        if(m.id!=null){
          state.lastId = m.id;
          if(state.knownIds[m.id]) return;
          state.knownIds[m.id] = true;
        }
        // reconcile optimistic temp bubble by client_id or own message text
        for(var i=0;i<state.pendingTemps.length;i++){
          var t = state.pendingTemps[i];
          if((m.client_id && m.client_id === t.id) || (state.me && m.from === state.me.id && m.text === t.text)){
            var el = els.list.querySelector('[data-mid="'+t.id+'"]');
            if(el) el.remove();
            state.pendingTemps.splice(i,1);
            break;
          }
        }
        fresh.push(m);
      });
      if(fresh.length) appendMessages(fresh, false);
      return fresh;
    });
  }
  function poll(silent){
    return fetchMessages().then(function(){
      if(!state.me || !state.bots.length) loadBots();
      flushOutbox(); // a successful read proves the path is back: resend queue
    }).catch(function(e){
      if(e && e.code===401){
        stopPolling();
        openTokenGate("这个 token 接口不认（401），换一个再试。");
      }
      // network failure: stay quiet, next poll retries
    });
  }

  /* ---------- sending: outbox queue ----------
     A message enters the outbox first and stays there until the POST is
     accepted. Network failure never bounces text back to the input and
     never deletes the bubble: it is marked 等待重发 and flushed
     automatically when any later call succeeds. */
  function markTemp(tempId, label){
    var el = els.list.querySelector('[data-mid="'+tempId+'"] .msg-time');
    if(el){
      var t = null;
      for(var i=0;i<state.pendingTemps.length;i++){ if(state.pendingTemps[i].id===tempId) t = state.pendingTemps[i]; }
      el.textContent = fmtTime(t ? t.ts : Date.now()) + " · " + label;
    }
  }
  function dropTemp(tempId){
    var el = els.list.querySelector('[data-mid="'+tempId+'"]');
    if(el) el.remove();
    state.pendingTemps = state.pendingTemps.filter(function(t){ return t.id!==tempId; });
  }
  function flushOutbox(){
    if(state.flushing || !state.outbox.length || !state.token) return;
    state.flushing = true;
    var item = state.outbox[0];
    apiCall("POST", "/api/messages", {text: item.text, to: item.to, client_id: item.tempId}, {attempts: 3}).then(function(){
      state.outbox.shift();
      state.flushing = false;
      setTimeout(function(){ poll(true); }, 400);
      flushOutbox();
    }).catch(function(e){
      state.flushing = false;
      if(e && e.code===401){
        state.outbox.shift();
        dropTemp(item.tempId);
        openTokenGate("发送时接口返回 401，token 可能不对，换一个再试。");
      } else if(e && e.code >= 400 && e.code < 500){
        state.outbox.shift();
        dropTemp(item.tempId);
        sysNote("消息未能发送（HTTP " + e.code + "）", true);
        flushOutbox();
      } else {
        markTemp(item.tempId, "等待网络恢复后自动重发");
      }
    });
  }
  function sendMessage(){
    var text = els.input.value.trim();
    if(!text) return;
    if(!state.token){ openTokenGate(""); return; }

    // @mention in text also sets recipient dynamically against state.bots or @all / @全部
    var mentioned = detectMention(text);
    var to = mentioned || state.selectedTo || "all";
    if(mentioned && state.selectedTo !== mentioned){
      state.selectedTo = mentioned;
      renderChips();
    }

    var tempId = "tmp-" + Date.now() + "-" + Math.floor(Math.random()*1e6);
    var temp = {
      id: tempId,
      ts: Date.now(),
      from: state.me ? state.me.id : "me",
      from_name: state.me ? state.me.name : "Me",
      to: to,
      text: text
    };
    state.pendingTemps.push(temp);
    state.outbox.push({tempId: tempId, text: text, to: to});
    if(els.empty) els.empty.style.display = "none";
    els.list.insertAdjacentHTML("beforeend", msgHTML(temp, true));
    scrollBottom();
    els.input.value = "";
    autoGrow();
    els.input.focus();
    flushOutbox();
  }

  /* ---------- polling ---------- */
  function startPolling(){
    if(state.pollTimer) return;
    state.pollTimer = setInterval(function(){ poll(true); }, 5000);
    state.healthTimer = setInterval(checkHealth, 30000);
  }
  function stopPolling(){
    if(state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer = null; }
    if(state.healthTimer){ clearInterval(state.healthTimer); state.healthTimer = null; }
  }

  function startChat(){
    if(state.started) { startPolling(); return; }
    state.started = true;
    checkHealth();
    loadBots().then(function(){
      return fetchMessages();
    }).then(function(){
      scrollBottom();
      startPolling();
    }).catch(function(e){
      if(e && e.code===401){
        state.started = false;
        openTokenGate("这个 token 接口不认（401），换一个再试。");
      } else {
        startPolling();
      }
    });
  }

  /* ---------- token gate ---------- */
  function openTokenGate(errMsg){
    var has = !!getToken();
    els.currentMasked.classList.toggle("hidden", !has);
    if(has) els.currentMasked.textContent = "当前已存：" + mask(getToken()) + "（只显示头尾，页面不显示明文）";
    els.cancelToken.classList.toggle("hidden", !has);
    els.clearToken.classList.toggle("hidden", !has);
    els.saveToken.textContent = has ? "保存新 token" : "保存并进入";
    els.tokenInput.value = "";
    els.tokenInput.type = "password";
    els.showToken.checked = false;
    els.tokenErr.textContent = errMsg || "";
    els.tokenErr.classList.toggle("show", !!errMsg);
    els.overlay.classList.add("open");
    setTimeout(function(){ els.tokenInput.focus(); }, 60);
  }
  function closeTokenGate(){ els.overlay.classList.remove("open"); }

  function cleanToken(raw){
    // tokens are plain hex; drop any whitespace a paste may have picked up
    return String(raw || "").replace(/\s+/g, "");
  }
  function verifyToken(t, attemptsLeft){
    // Same dual-transport idea as apiCall, but with the candidate token
    // instead of the stored one. Only a real 401 proves the token wrong.
    var url = API + "/api/messages?limit=1";
    var headers = {"Authorization":"Bearer " + t};
    var attempt = fetchRequest("GET", url, headers, null).catch(function(){
      return xhrRequest("GET", url, headers, null);
    });
    return attempt.then(function(res){
      if(res.status===401){ var e = new Error("unauthorized"); e.code = 401; throw e; }
      if(res.status>=400) throw new Error("http " + res.status);
      return true;
    }).catch(function(e){
      if(e && e.code===401) throw e;
      if(attemptsLeft > 1){
        return delay(900).then(function(){ return verifyToken(t, attemptsLeft - 1); });
      }
      var ne = new Error("unreachable"); ne.code = "net"; throw ne;
    });
  }
  function enterWithToken(t, note){
    stopPolling();
    setToken(t);
    state.token = t;
    state.me = null;
    closeTokenGate();
    state.started = false;
    state.lastId = null; state.knownIds = {};
    state.pendingTemps = [];
    state.outbox = [];
    els.list.querySelectorAll(".msg,.sys-note").forEach(function(n){ n.remove(); });
    if(els.empty) els.empty.style.display = note ? "none" : "";
    startChat();
    if(note) sysNote(note, false);
  }
  els.saveToken.addEventListener("click", function(){
    var t = cleanToken(els.tokenInput.value);
    if(!t){
      els.tokenErr.textContent = "先把 token 粘进来。";
      els.tokenErr.classList.add("show");
      return;
    }
    els.saveToken.disabled = true;
    els.saveToken.textContent = "验证中…";
    els.tokenErr.classList.remove("show");
    // Verify with retries: one flaky attempt must not lock the user out.
    verifyToken(t, 3).then(function(){
      els.saveToken.disabled = false;
      els.saveToken.textContent = "保存并进入";
      enterWithToken(t, "");
    }).catch(function(e){
      els.saveToken.disabled = false;
      els.saveToken.textContent = getToken() ? "保存新 token" : "保存并进入";
      if(e && e.code===401){
        els.tokenErr.textContent = "接口明确拒绝了这个 token（401 未授权），这不是网络问题。请核对 token 是否填写完整、中间不要有空格。";
        els.tokenErr.classList.add("show");
      } else {
        // Unreachable after retries: the token cannot be proven wrong, so
        // save it and enter. Polling keeps retrying; a real 401 later
        // reopens this gate with the unauthorized message above.
        enterWithToken(t, "接口暂时连不上，已先保存这个 token 并进入。网络恢复后消息会自动加载；如果 token 不对，页面会再提示你重新填写。");
      }
    });
  });
  els.tokenInput.addEventListener("keydown", function(e){
    if(e.key==="Enter"){ e.preventDefault(); els.saveToken.click(); }
  });
  els.showToken.addEventListener("change", function(){
    els.tokenInput.type = els.showToken.checked ? "text" : "password";
    els.tokenInput.focus();
  });
  els.cancelToken.addEventListener("click", closeTokenGate);
  els.clearToken.addEventListener("click", function(){
    setToken(""); state.token = ""; state.me = null; state.bots = [];
    renderPeople(); renderChips();
    stopPolling(); state.started = false;
    closeTokenGate();
    openTokenGate("已清除，粘一个新的 token 才能继续收发。");
  });
  els.tokenBtn.addEventListener("click", function(){ openTokenGate(""); });

  /* ---------- composer wiring ---------- */
  function autoGrow(){
    els.input.style.height = "auto";
    els.input.style.height = Math.min(els.input.scrollHeight, 120) + "px";
  }
  els.input.addEventListener("input", function(){
    autoGrow();
    var mentioned = detectMention(els.input.value);
    if(mentioned && state.selectedTo !== mentioned){
      state.selectedTo = mentioned;
      renderChips();
    }
  });
  els.input.addEventListener("keydown", function(e){
    if(e.key==="Enter" && !e.shiftKey && !e.isComposing){
      e.preventDefault();
      sendMessage();
    }
  });
  els.send.addEventListener("click", sendMessage);
  els.refresh.addEventListener("click", function(){ checkHealth(); poll(true); flushOutbox(); });
  document.querySelectorAll(".quick").forEach(function(b){
    b.addEventListener("click", function(){
      var fill = b.getAttribute("data-fill") || "";
      els.input.value = fill;
      autoGrow();
      els.input.focus();
      // place cursor at end
      els.input.setSelectionRange(els.input.value.length, els.input.value.length);
    });
  });
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden && state.token){ poll(true); flushOutbox(); }
  });

  /* ---------- boot ---------- */
  renderPeople();
  renderChips();
  autoGrow();
  state.token = getToken();
  checkHealth();
  if(state.token){
    startChat();
  } else {
    openTokenGate("");
  }
})();
</script>
</body>
</html>
